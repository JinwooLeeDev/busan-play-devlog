<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Busan Play | Engineering Devlog</title>
    <link rel="stylesheet" href="style.css" />
    <script defer src="data.js"></script>
    <script defer src="app.js"></script>
  </head>
  <body>
    <header>
      <a class="brand" href="#">BUSAN PLAY <small>/ DEVLOG</small></a>
      <nav>
        <a href="https://github.com/JinwooLeeDev/event-platform">GitHub ↗</a
        ><a href="https://github.com/JinwooLeeDev/event-platform/wiki">Wiki ↗</a
        >
      </nav>
    </header>
    <main>
      <section class="hero">
        <h1>문제를 만나고,<br />해결을 기록하다.</h1>
        <p>
          Busan Play를 만든 5명의 개발자. 오류의 원인부터 기술 선택의 이유까지, 개발 과정의 판단을 모았습니다.
        </p>
        <div id="stats" class="stats"></div>
      </section>
      <section id="troubleshooting" aria-labelledby="records-title">
        <div class="section-heading">
          <div><h2 id="records-title">트러블슈팅 기록</h2>
          <p>팀원을 선택하거나, 관심 있는 기록을 바로 읽어보세요.</p></div>
        </div>
        <div class="workspace">
          <aside aria-label="팀원별 기록 선택"><div id="members" class="members"></div></aside>
          <div class="records-panel">
            <div class="records-heading"><h3 id="list-title">전체 기록</h3><span id="count" aria-live="polite"></span></div>
            <p id="member-description" class="member-tasks" hidden></p>
            <div id="records" class="record-list"></div>
          </div>
        </div>
      </section>
    </main>
    <footer>BUSAN PLAY · Engineering Devlog · 2026</footer>
    <dialog id="detail" aria-labelledby="detail-title">
      <div class="dialogbar"><button id="close">닫기 ×</button></div>
      <article id="article"></article>
    </dialog>
  </body>
</html>
