<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Busan Play | Engineering Devlog</title>
    <link rel="stylesheet" href="style.css" />
    <script defer src="data.js"></script>
    <script defer src="app.js"></script>
  </head>
  <body>
    <header>
      <a class="brand" href="#">BUSAN PLAY <small>/ DEVLOG</small></a>
      <nav>
        <a href="https://github.com/JinwooLeeDev/event-platform">GitHub ↗</a

      </nav>

    <main>
      <section class="hero">
        <p class="eyebrow">ENGINEERING NOTES / 2026</p>
        <h1>Behind the<br />Busan Play<span>.</span></h1>

          <span class="tag">5명의 문제 해결 기록</span>

    <footer>BUSAN PLAY · Engineering Devlog · 2026</footer>

      <div class="dialogbar"><button id="close">닫기 ×</button></div>
